version: 0.2

phases:
  install:
    commands:
      - echo "🔧 Installing dependencies..."
      - apt-get update -y
      - apt-get install -y unzip wget jq
      - wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
      - tar -xvf gitleaks_8.18.0_linux_x64.tar.gz -C /usr/local/bin
      - wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.51.4_Linux-64bit.tar.gz
      - tar -xvf trivy_0.51.4_Linux-64bit.tar.gz -C /usr/local/bin
  build:
    commands:
      - echo "🚨 Running Security Scans..."
      - gitleaks detect --source . --report-format json --report-path gitleaks-report.json || true
      - trivy fs . --format json --output trivy-report.json || true

      # Fail the build if critical vulnerabilities are found
      - |
        CRITICAL=$(jq '.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")' trivy-report.json | wc -l)
        if [ "$CRITICAL" -gt 0 ]; then
          echo "❌ Critical vulnerabilities found ($CRITICAL). Failing build."
          exit 1
        fi
      - echo "✅ No critical vulnerabilities detected. Build complete."

artifacts:
  files:
    - gitleaks-report.json
    - trivy-report.json
